name: ci

on:
  workflow_dispatch:
  push:
    paths:
      - src/**
#      - Dockerfile
#      - requirements.txt
#      - .github/workflows/**
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ramesh4500/python-app:${{ env.SHORT_SHA }}
