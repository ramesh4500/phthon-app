name: cicd

on:
  workflow_dispatch:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ramesh4500/python-app:${{ env.COMMIT_ID }}
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:

      # Cloning Github repository!!!
      - uses: actions/checkout@v3

      # Updatings the docker image tag!!! 
      - name: Modify values file
        shell: bash
        run: |
          echo ${{needs.ci.outputs.commit_id}}
          sudo apt update
          sudo apt install -y pipx jq
          pipx install yq
          yq -Yi '.image.tag = "${{needs.ci.outputs.commit_id}}"' charts/python-app/values.yaml

      # Commiting the changes of "values.yaml" file to remote branch!!!
      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates values.yaml file with commit ${{needs.ci.outputs.commit_id}}'


      - name: Install argocd cli
        shell: bash
        run: |
          curl -ksSL -o argocd https://jill-commorant-jayden.ngrok-free.dev/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd app sync
        shell: bash
        run: |
          argocd login jill-commorant-jayden.ngrok-free.dev \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-pp
